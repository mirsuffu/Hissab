<!doctype html>
<html lang="en" data-theme="mist">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
  <title>Hisaab</title>
  <script>
    try {
      const p = JSON.parse(localStorage.getItem('hisaab.prefs') || '{}');
      const t = p.theme || 'auto';
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = t === 'auto' ? (dark ? 'ink' : 'mist') : t;
      if (p.mode) document.documentElement.dataset.mode = p.mode;
      if (p.hue) document.documentElement.style.setProperty('--accent-h', p.hue);
    } catch {}
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="logo-48.png">
  <link rel="apple-touch-icon" href="logo-192.png">
  <meta name="theme-color" content="#2f9e7a">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="app-topbar glass">
    <div class="topbar-left">
      <a href="#/account" class="topbar-brand" id="user-dp" title="Account & Identity" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit">
        <img src="logo-48.png" alt="Hisaab Logo" class="brand-logo" style="width:28px;height:28px;border-radius:7px;object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.25)">
        <span class="brand-text">Hisaab</span>
      </a>
    </div>
    <div class="topbar-right">
      <button type="button" id="sync-chip" class="sync-chip synced" title="Sync Status: Synced" aria-label="Sync Status">
        <span class="sync-chip-dot"></span>
        <span class="sync-chip-text">Synced</span>
      </button>
      <a href="#/settings" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </div>
  </header>
  <div class="shell">
    <nav id="nav" class="nav glass" aria-label="Main"></nav>
    <main id="view"></main>
  </div>
  <button id="fab-add" class="fab fab-add" aria-label="Add entry" title="Add entry (Drag to reposition)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button id="fab-ai" class="fab fab-ai" aria-label="Munimji AI Assistant" title="Munimji AI (Drag to reposition)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/><path d="M19 3v4M21 5h-4M5 19v2M6 20H4"/></svg>
    <span class="fab-ai-text">Munimji AI</span>
  </button>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
